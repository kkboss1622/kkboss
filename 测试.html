<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>摄像头扫码识别 - 二维码/条形码转文本</title>
    <!-- 引入流行的扫码库: html5-qrcode，轻量且支持二维码和多种条形码 -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #0b2b2c 0%, #0a1f1f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .scanner-card {
            max-width: 700px;
            width: 100%;
            background: rgba(22, 40, 42, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 2.5rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(120, 200, 180, 0.2);
            overflow: hidden;
            padding: 1.5rem;
            transition: all 0.2s ease;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            text-align: center;
            background: linear-gradient(135deg, #c0f0e8, #7fd1b0);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
            margin-bottom: 0.5rem;
        }

        .sub {
            text-align: center;
            color: #a2d8cf;
            font-weight: 500;
            font-size: 0.85rem;
            margin-bottom: 1.8rem;
            border-bottom: 1px dashed #2e6e64;
            display: inline-block;
            width: auto;
            margin-left: auto;
            margin-right: auto;
            padding-bottom: 6px;
        }

        /* 摄像头取景器区域 */
        .video-container {
            position: relative;
            background: #000;
            border-radius: 1.8rem;
            overflow: hidden;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
            margin-bottom: 1.5rem;
            border: 1px solid rgba(80, 200, 170, 0.5);
        }

        #reader {
            width: 100%;
            min-height: 280px;
            background: #111;
        }

        /* 覆盖内置的一些样式，使取景框好看 */
        .video-container video {
            width: 100%;
            display: block;
            object-fit: cover;
        }

        /* 自定义扫描指示线 */
        .scan-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .scan-line {
            position: absolute;
            top: 20%;
            left: 10%;
            width: 80%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #6effd4, #2effbc, #6effd4, transparent);
            border-radius: 4px;
            box-shadow: 0 0 12px #00ffcc;
            animation: scanMove 2.2s ease-in-out infinite;
            opacity: 0.7;
        }

        @keyframes scanMove {
            0% {
                top: 15%;
                opacity: 0.3;
            }
            50% {
                top: 75%;
                opacity: 1;
            }
            100% {
                top: 15%;
                opacity: 0.3;
            }
        }

        .corner-tl, .corner-tr, .corner-bl, .corner-br {
            position: absolute;
            width: 45px;
            height: 45px;
            border: 3px solid #00ffcc;
            filter: drop-shadow(0 0 6px cyan);
        }
        .corner-tl { top: 15px; left: 15px; border-right: none; border-bottom: none; }
        .corner-tr { top: 15px; right: 15px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 15px; left: 15px; border-right: none; border-top: none; }
        .corner-br { bottom: 15px; right: 15px; border-left: none; border-top: none; }

        /* 控制栏 */
        .controls {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin: 20px 0 18px;
            flex-wrap: wrap;
        }

        button {
            background: #1e4a4a;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 60px;
            color: #e2fdf5;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            border: 1px solid rgba(90, 210, 170, 0.4);
            letter-spacing: 0.5px;
        }

        button:active {
            transform: scale(0.96);
        }

        button.primary {
            background: #0cb886;
            color: #021c1a;
            font-weight: bold;
            box-shadow: 0 0 12px rgba(12, 184, 134, 0.5);
            border-color: #bbffdd;
        }

        button.danger {
            background: #7a2e2e;
            border-color: #ff8a7a;
            color: #ffe0d0;
        }

        .result-area {
            background: #0f2a28c9;
            border-radius: 1.5rem;
            padding: 1.2rem;
            margin-top: 0.6rem;
            border: 1px solid #36ab92;
            backdrop-filter: blur(4px);
        }

        .result-label {
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #88ddcc;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .result-text {
            background: #031010c9;
            padding: 16px 18px;
            border-radius: 1.2rem;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 1rem;
            word-break: break-all;
            white-space: pre-wrap;
            color: #dafef0;
            border-left: 5px solid #1ae6b0;
            max-height: 180px;
            overflow-y: auto;
            line-height: 1.4;
        }

        .status-msg {
            font-size: 0.8rem;
            text-align: center;
            margin-top: 12px;
            background: #1d3936;
            display: inline-block;
            width: auto;
            padding: 6px 16px;
            border-radius: 60px;
            color: #b7f0e3;
        }

        .flex-status {
            display: flex;
            justify-content: center;
        }

        footer {
            font-size: 0.7rem;
            text-align: center;
            color: #528a7e;
            margin-top: 20px;
        }

        @media (max-width: 550px) {
            .scanner-card {
                padding: 1rem;
            }
            button {
                padding: 8px 18px;
                font-size: 0.85rem;
            }
            .corner-tl, .corner-tr, .corner-bl, .corner-br {
                width: 30px;
                height: 30px;
            }
        }
    </style>
</head>
<body>
<div class="scanner-card">
    <h1>📷 智能解码器</h1>
    <div style="text-align: center;">
        <span class="sub">二维码 / 条形码 → 实时文本提取</span>
    </div>

    <!-- 摄像头扫码区域 -->
    <div class="video-container" id="videoContainer">
        <div id="reader"></div>
        <div class="scan-overlay">
            <div class="scan-line"></div>
            <div class="corner-tl"></div>
            <div class="corner-tr"></div>
            <div class="corner-bl"></div>
            <div class="corner-br"></div>
        </div>
    </div>

    <!-- 操作按钮组 -->
    <div class="controls">
        <button id="startScanBtn" class="primary">🎥 打开摄像头并扫描</button>
        <button id="stopScanBtn" class="danger">⏹️ 关闭摄像头</button>
        <button id="clearTextBtn">🧹 清空结果</button>
    </div>

    <!-- 显示识别出的文本结果 -->
    <div class="result-area">
        <div class="result-label">
            <span>🔍 识别结果 (文本)</span>
            <span style="font-size:12px;">✨ 自动连续扫描</span>
        </div>
        <div class="result-text" id="resultText">
            — 等待扫码，摄像头开启后将自动识别二维码/条形码 —
        </div>
        <div class="flex-status">
            <div class="status-msg" id="statusMsg">
                ⚡ 尚未开启摄像头
            </div>
        </div>
    </div>
    <footer>
        ⚡ 支持 QR Code, EAN-13, Code128, UPC-A, 等主流一维/二维码 | 基于 html5-qrcode
    </footer>
</div>

<script>
    // 全局对象管理 Html5Qrcode 实例
    let html5QrCode = null;
    let isScanning = false;
    let lastDecodedText = "";
    const qrRegionId = "reader";

    // DOM 元素
    const startBtn = document.getElementById('startScanBtn');
    const stopBtn = document.getElementById('stopScanBtn');
    const clearBtn = document.getElementById('clearTextBtn');
    const resultTextDiv = document.getElementById('resultText');
    const statusSpan = document.getElementById('statusMsg');

    // 辅助函数: 更新界面状态文本
    function setStatusMessage(msg, isError = false) {
        if (statusSpan) {
            statusSpan.innerHTML = isError ? `⚠️ ${msg}` : `✨ ${msg}`;
            statusSpan.style.color = isError ? "#ffb7a0" : "#b7f0e3";
        }
    }

    // 更新识别结果的文本区
    function updateResultText(decodedString) {
        if (!decodedString || decodedString.trim() === "") return;
        // 避免重复刷新完全一样的内容 (同一码连续识别时不会重复追加)
        if (lastDecodedText === decodedString) return;
        lastDecodedText = decodedString;
        
        // 获取当前显示内容，保留旧记录下追加，但更清楚的是新结果插入顶部，保留最多5条记录? 为了方便: 显示最新结果，并保留历史预览
        const currentContent = resultTextDiv.innerText;
        // 如果当前是默认占位文字，则直接替换
        if (currentContent.includes("等待扫码，摄像头开启后将自动识别二维码/条形码") || currentContent.trim() === "— 等待扫码，摄像头开启后将自动识别二维码/条形码 —") {
            resultTextDiv.innerText = `📌 最新解码:\n${decodedString}`;
        } else {
            // 保留最近5个结果避免太长，但保持整洁，将最新结果放在最上面
            let lines = currentContent.split('\n');
            // 限制最多保存10行，避免过臃肿
            if (lines.length > 12) {
                lines = lines.slice(0, 10);
            }
            // 重新组织: 最新结果置顶并加入时间戳
            const timeStr = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
            const newEntry = `[${timeStr}] ${decodedString}`;
            // 避免完全相同的最新行且没有变化 已经基于 lastDecodedText 判断，但额外再次滤重。
            if (lines[0] && lines[0].includes(decodedString) && lines[0].includes(timeStr)) {
                return;
            }
            resultTextDiv.innerText = `${newEntry}\n${lines.join('\n')}`;
        }
        // 自动滚动到底部显示最新（实际最新结果在首行对于用户直观）
        resultTextDiv.scrollTop = 0; // 最新在顶部，滚动到顶部方便看
        // 播放一个简单的反馈（可选，轻提示）
        setStatusMessage(`识别成功: ${decodedString.substring(0, 48)}${decodedString.length > 48 ? '…' : ''}`);
    }

    // 停止扫描并彻底关闭摄像头
    async function stopScanner() {
        if (html5QrCode && isScanning) {
            try {
                await html5QrCode.stop();
                isScanning = false;
                setStatusMessage("摄像头已关闭");
                // 清除视频流占位
                if (html5QrCode) {
                    // 可选清空渲染区域
                    const readerElement = document.getElementById(qrRegionId);
                    if (readerElement) {
                        // 清除里面所有的 视频/画布 元素，保证彻底关闭
                        while (readerElement.firstChild) {
                            readerElement.removeChild(readerElement.firstChild);
                        }
                    }
                }
            } catch (err) {
                console.warn("停止扫描出现异常", err);
                setStatusMessage("停止失败，但摄像头可能已关闭", true);
            } finally {
                html5QrCode = null;
                isScanning = false;
            }
        } else {
            if (!html5QrCode) {
                setStatusMessage("没有活动的扫描器", false);
            }
        }
    }

    // 启动摄像头 + 扫码器 (核心)
    async function startScanner() {
        // 如果已经有扫描实例，先关闭再重新开启（避免冲突）
        if (html5QrCode && isScanning) {
            await stopScanner();
        }
        
        // 重新创建实例
        try {
            // 清理残留的DOM内容
            const readerDiv = document.getElementById(qrRegionId);
            if (readerDiv) {
                while (readerDiv.firstChild) {
                    readerDiv.removeChild(readerDiv.firstChild);
                }
            }
            
            html5QrCode = new Html5Qrcode(qrRegionId);
            
            // 配置扫码参数：使用后置摄像头（默认后置），提高识别频率
            const config = {
                fps: 20,                // 每秒识别帧数，流畅度较高
                qrbox: { width: 280, height: 280 },   // 扫描矩形区域尺寸，确保对准就能扫
                aspectRatio: 1.33333,  // 常规摄像头比例 4:3 
                showTorchButtonIfSupported: true,   // 如果手机支持闪光灯显示按钮
                verbose: false,         // 避免打印大量日志
            };
            
            // 开始扫描，希望调用后置摄像头（默认video facing mode: environment）
            // 注意: 如果移动端设备，environment代表后置摄像头，user代表前置。
            // 优先使用后置摄像头扫码体验更好。
            const qrCodeSuccessCallback = (decodedText, decodedResult) => {
                // 成功解码时的回调
                if (decodedText && decodedText !== lastDecodedText) {
                    updateResultText(decodedText);
                    // 可选轻微震动（如果支持，移动端微交互）
                    if (navigator.vibrate) {
                        navigator.vibrate(80);
                    }
                } else if (decodedText && decodedText === lastDecodedText) {
                    // 相同结果不做重复更新，避免UI闪烁，但是继续监听后续新码
                    // 什么都不做
                }
            };
            
            const qrErrorCallback = (errorMessage) => {
                // 识别错误回调（一般仅为解码失败，非致命）
                // 为了体验，不频繁打印，但可以偶尔更新状态，不干扰用户
                if (errorMessage && errorMessage.includes("No MultiFormat Readers")) {
                    // 忽略这种提示，常见暂时没码
                }
            };
            
            setStatusMessage("请求摄像头权限中...");
            // 开始扫描使用 rear camera (后置)
            // 重要: 需要传递 facingMode: "environment"，浏览器自动选择后置
            // html5-qrcode 参数: (cameraIdOrFacingMode, config, qrCodeSuccessCallback, qrErrorCallback)
            // 方法: start(facingMode, config, callback, errorCallback)
            await html5QrCode.start(
                { facingMode: "environment" },  // 后置摄像头
                config,
                qrCodeSuccessCallback,
                qrErrorCallback
            );
            isScanning = true;
            setStatusMessage("📸 摄像头工作中，请将二维码/条形码对准框内自动识别");
        } catch (err) {
            console.error("启动摄像头或扫码失败: ", err);
            let errMsg = "无法启动摄像头，请检查：";
            if (err.message && err.message.includes("NotAllowedError")) {
                errMsg = "未授予摄像头权限，请允许访问摄像头后重试。";
            } else if (err.message && err.message.includes("NotFoundError")) {
                errMsg = "未检测到摄像头设备，请连接摄像头或检查驱动。";
            } else if (err.message && err.message.includes("NotReadableError")) {
                errMsg = "摄像头被其他应用占用，请关闭其他摄像头应用。";
            } else if (err.message && err.message.includes("OverconstrainedError")) {
                errMsg = "无法使用后置摄像头，可尝试刷新或允许使用前置试试。";
            } else {
                errMsg = `启动失败: ${err.message || "未知错误"}。请确认通过 HTTPS 或 localhost 访问。`;
            }
            setStatusMessage(errMsg, true);
            // 清理异常状态 ref
            if (html5QrCode) {
                try {
                    await html5QrCode.stop();
                } catch (e) {}
                html5QrCode = null;
            }
            isScanning = false;
        }
    }

    // 容错处理：如果用户点击关闭，彻底释放
    stopBtn.addEventListener('click', async () => {
        await stopScanner();
        // 清空一下状态视图，让界面显示无摄像头预览，重新显示占位
        const container = document.getElementById(qrRegionId);
        if (container) {
            const placeHolderMsg = document.createElement('div');
            // 不覆盖原有显示的过度，但简单清空后增加一个提示占位
            while (container.firstChild) container.removeChild(container.firstChild);
            const stub = document.createElement('div');
            stub.style.display = "flex";
            stub.style.alignItems = "center";
            stub.style.justifyContent = "center";
            stub.style.height = "240px";
            stub.style.backgroundColor = "#011010";
            stub.style.borderRadius = "1.2rem";
            stub.style.color = "#5b9b8f";
            stub.innerText = "📴 摄像头已关闭，点击【打开摄像头】开始扫描";
            container.appendChild(stub);
        }
    });
    
    startBtn.addEventListener('click', async () => {
        // 移除之前可能残留占位文本元素，保证重新启动时干净
        const container = document.getElementById(qrRegionId);
        if (container) {
            // 清除人为添加的占位并保留原始结构，但无需过度清洗因为 startScanner 内部也会清理 child。
            // 但是确保没有额外div影响识别区域。
            while (container.firstChild) container.removeChild(container.firstChild);
        }
        await startScanner();
    });
    
    clearBtn.addEventListener('click', () => {
        resultTextDiv.innerText = "📭 识别结果已清空，下次扫码将显示新内容";
        lastDecodedText = "";
        setStatusMessage(isScanning ? "扫描中，结果已清空" : "内容已清空");
    });
    
    // 页面关闭或离开时主动停止摄像头，释放资源 (重要)
    window.addEventListener('beforeunload', async () => {
        if (html5QrCode && isScanning) {
            try {
                await html5QrCode.stop();
            } catch(e) {}
        }
    });
    
    // 初始化提示，实际上需手动点击按钮，兼容一些自动请求flag？考虑到用户体验最好不自动请求权限
    // 展示默认界面友好提示 
    setStatusMessage("点击「打开摄像头并扫描」启用扫码");
    
    // 辅助说明: 如果没有 https/localhost 环境，给出额外控制台提示
    if (location.protocol !== 'https:' && location.hostname !== 'localhost' && !location.hostname.startsWith('127.0.0.1')) {
        const warnMsg = "⚠️ 当前非 HTTPS 或 localhost, 部分浏览器可能阻止摄像头调用。请使用 HTTPS 或本地测试。";
        console.warn(warnMsg);
        if (statusSpan) {
            statusSpan.innerHTML = `🔒 ${warnMsg}`;
            statusSpan.style.color = "#ffc285";
        }
    }
    
    // 移动端适配：给个小提示
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    if (isMobile) {
        const tip = document.createElement('div');
        tip.style.marginTop = "12px";
        tip.style.fontSize = "12px";
        tip.style.textAlign = "center";
        tip.style.color = "#abd9ce";
        tip.innerText = "📱 将二维码置于扫描框内，自动识别结果。";
        document.querySelector('.result-area').after(tip);
    }
</script>
</body>
</html>
