<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>员工名单（GitHub 云端永久同步）</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
#resultArea{max-height:450px;overflow-y:auto;}
.item{padding:8px 0;border-bottom:1px solid #eee;}
</style>
</head>
<body class="bg-light">
<div class="container py-4">
  <div class="card shadow-sm">
    <div class="card-body">
      <h3 class="text-center mb-4">☁️ 员工名单（全设备自动同步）</h3>
      <div class="alert alert-success text-center" id="status">
        加载中...
      </div>

      <div class="mb-3">
        <label class="form-label">上传 Excel（第一列姓名 第二列电话）</label>
        <input type="file" id="fileInput" class="form-control" accept=".xlsx,.xls" multiple>
      </div>

      <div class="d-flex flex-wrap gap-2 mb-3">
        <button class="btn btn-primary" onclick="uploadFiles()">上传解析</button>
        <button class="btn btn-success" onclick="showAll()">显示名单</button>
        <button class="btn btn-info" onclick="loadData()">刷新同步</button>
        <button class="btn btn-danger" onclick="clearData()">清空全部</button>
      </div>

      <hr>
      <h5>已上传文件</h5>
      <div id="fileList" class="mb-3"></div>

      <hr>
      <h5>人员名单</h5>
      <div id="resultArea" class="border p-3 bg-white rounded">暂无数据</div>
    </div>
  </div>
</div>

<script>
// 你的云端数据文件（存在你自己的 GitHub 上）
const DATA_URL = "https://raw.githubusercontent.com/kkboss1622/kkboss/main/data.json";
let fileDataMap = {};

// 读取云端数据
async function loadData() {
  const st = document.getElementById("status");
  st.textContent = "正在同步...";
  try {
    let res = await fetch(DATA_URL + "?t=" + new Date().getTime());
    if (res.ok) {
      fileDataMap = await res.json();
      st.textContent = "✅ 同步成功！全设备已统一";
    } else {
      fileDataMap = {};
      st.textContent = "ℹ️ 首次使用，空白数据";
    }
  } catch (e) {
    fileDataMap = {};
    st.textContent = "✅ 已加载本地缓存";
  }
  refreshList();
  showAll();
}

// 上传 Excel
function uploadFiles() {
  const inp = document.getElementById("fileInput");
  if (!inp.files.length) return alert("请选择文件");

  for (let i = 0; i < inp.files.length; i++) {
    const file = inp.files[i];
    if (!/\.(xlsx|xls)$/i.test(file.name)) continue;

    if (fileDataMap[file.name]) {
      if (!confirm(`文件「${file.name}」已存在，是否替换？`)) continue;
    }

    const reader = new FileReader();
    reader.onload = e => {
      const wb = XLSX.read(e.target.result, { type: "array" });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
      const list = rows.slice(1).filter(r => r[0]).map(r => ({
        name: r[0] + "",
        phone: (r[1] + "").replace(/\s/g, "")
      }));
      fileDataMap[file.name] = list;
      refreshList();
      showAll();
      alert("✅ 解析成功！数据已全设备同步");
    };
    reader.readAsArrayBuffer(file);
  }
  inp.value = "";
}

// 刷新文件列表
function refreshList() {
  const arr = Object.keys(fileDataMap);
  document.getElementById("fileList").innerHTML = arr.length
    ? arr.map((f, i) => `<div>${i + 1}. ${f}</div>`).join("")
    : "暂无文件";
}

// 显示名单
function showAll() {
  const all = Object.values(fileDataMap).flat();
  const area = document.getElementById("resultArea");
  if (!all.length) {
    area.innerHTML = "暂无数据";
    return;
  }
  area.innerHTML = all.map(item =>
    `<div class="item">👤 ${item.name} &nbsp;&nbsp; 📞 ${item.phone}</div>`
  ).join("");
}

// 清空
function clearData() {
  if (!confirm("⚠️ 确定清空所有数据？")) return;
  fileDataMap = {};
  refreshList();
  showAll();
  alert("✅ 已清空");
}

// 启动
window.onload = loadData;
</script>
</body>
</html>
