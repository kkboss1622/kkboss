<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跨设备共享｜员工名单管理</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
#resultArea{max-height:450px;overflow-y:auto;}
.item{padding:8px 0;border-bottom:1px solid #eee;}
</style>
</head>
<body class="bg-light">
<div class="container py-4">
  <div class="card shadow-sm">
    <div class="card-body">
      <h3 class="text-center mb-4">☁️ 跨设备共享 员工名单</h3>

      <div class="mb-3">
        <label class="form-label">上传Excel（第一列姓名 / 第二列电话）</label>
        <input type="file" id="fileInput" class="form-control" accept=".xlsx,.xls" multiple>
      </div>

      <div class="d-flex flex-wrap gap-2 mb-3">
        <button class="btn btn-primary" onclick="uploadFiles()">上传解析</button>
        <button class="btn btn-success" onclick="showAllData()">显示名单</button>
        <button class="btn btn-info" onclick="syncData()">刷新同步</button>
        <button class="btn btn-warning" onclick="exportData()">导出共享包</button>
        <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">导入共享包</button>
        <input type="file" id="importFile" hidden accept=".json" onchange="importData(this)">
        <button class="btn btn-danger" onclick="clearAll()">清空全部</button>
      </div>

      <hr>
      <h5>已上传文件</h5>
      <div id="fileList" class="mb-3 text-secondary"></div>

      <hr>
      <h5>人员名单（姓名 + 电话）</h5>
      <div id="resultArea" class="border p-3 rounded bg-white">暂无数据</div>
    </div>
  </div>

<script>
const STORE_KEY = "staff_all_data_202605";

// 读取本地储存
function getLocalData(){
  let txt = localStorage.getItem(STORE_KEY);
  return txt ? JSON.parse(txt) : {};
}
// 保存本地
function saveLocalData(obj){
  localStorage.setItem(STORE_KEY, JSON.stringify(obj));
}

let fileDataMap = getLocalData();

// 刷新同步
function syncData(){
  fileDataMap = getLocalData();
  refreshFileList();
  showAllData();
  alert("✅ 已同步最新数据");
}

// 上传Excel
function uploadFiles() {
  const input = document.getElementById('fileInput');
  if (!input.files.length) return alert("请选择Excel文件");

  for (let i = 0; i < input.files.length; i++) {
    let file = input.files[i];
    if (!/\.(xlsx|xls)$/i.test(file.name)) continue;

    // 同名询问替换
    if (fileDataMap[file.name]) {
      if (!confirm(`文件【${file.name}】已存在，是否替换？`)) continue;
    }

    const reader = new FileReader();
    reader.onload = function(e){
      const wb = XLSX.read(e.target.result, {type:"array"});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1});

      // 第一行标题跳过，固定：第一列名字，第二列电话
      const list = rows.slice(1)
        .filter(r => r[0])
        .map(r => ({
          name: r[0] || "",
          phone: r[1] || ""
        }));

      fileDataMap[file.name] = list;
      saveLocalData(fileDataMap);
      refreshFileList();
      showAllData();
    };
    reader.readAsArrayBuffer(file);
  }
  input.value = "";
}

// 刷新文件列表
function refreshFileList(){
  let wrap = document.getElementById("fileList");
  let arr = Object.keys(fileDataMap);
  wrap.innerHTML = arr.length 
    ? arr.map((f,i)=>`<div>${i+1}. ${f}</div>`).join("")
    : "暂无文件";
}

// 展示所有人员
function showAllData(){
  let wrap = document.getElementById("resultArea");
  let all = Object.values(fileDataMap).flat();
  if(!all.length){
    wrap.innerHTML = "暂无数据";
    return;
  }
  let html = "";
  all.forEach(item=>{
    html += `<div class="item">👤 ${item.name} &nbsp;&nbsp; 📞 ${item.phone}</div>`;
  });
  wrap.innerHTML = html;
}

// 导出共享数据包 json
function exportData(){
  let jsonStr = JSON.stringify(fileDataMap, null, 2);
  let blob = new Blob([jsonStr], {type:"application/json"});
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "员工名单共享包.json";
  a.click();
  alert("✅ 导出成功，把这个文件发到其他电脑即可同步");
}

// 导入共享数据包
function importData(el){
  let file = el.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      let obj = JSON.parse(e.target.result);
      fileDataMap = obj;
      saveLocalData(fileDataMap);
      refreshFileList();
      showAllData();
      alert("✅ 导入成功，已同步全部名单");
    }catch{
      alert("❌ 文件格式错误");
    }
  };
  reader.readAsText(file);
  el.value = "";
}

// 清空全部
function clearAll(){
  if(!confirm("⚠️ 确定清空所有名单数据？不可恢复！"))return;
  fileDataMap = {};
  saveLocalData(fileDataMap);
  refreshFileList();
  document.getElementById("resultArea").innerHTML = "暂无数据";
}

// 页面初始化
window.onload = function(){
  refreshFileList();
  showAllData();
}
</script>
</body>
</html>
